<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css?v=final_fix_v3">
</head>
<body>
    <div class="container">
        <h1 class="title">МАЛЮСКА</h1>
        
        <div class="form-group">
            <label>возраст:</label>
            <div class="age-selector">
                <button type="button" class="age-btn" id="age-18" onclick="setAge(18)">18+</button>
                <button type="button" class="age-btn" id="age-under" onclick="setAge(17)">до 18</button>
            </div>
        </div>

        <div class="form-group">
            <label>что шьем?</label>
            <select id="service_type">
                <option value="септум">септум</option>
                <option value="нострил">нострил</option>
            </select>
        </div>

        <div class="form-group">
            <input type="date" id="order_date">
            <input type="time" id="order_time">
        </div>

        <button class="main-button" id="submit_btn" onclick="sendData()">забронировать</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        let selectedAge = ""; 
        tg.expand();

        // устанавливаем минимальную дату - сегодня
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('order_date').setAttribute('min', today);

        function setAge(age) {
            selectedAge = age >= 18 ? "18+" : "до 18";
            
            // правильно переключаем классы
            document.getElementById('age-18').classList.remove('active');
            document.getElementById('age-under').classList.remove('active');
            
            if (age >= 18) {
                document.getElementById('age-18').classList.add('active');
            } else {
                document.getElementById('age-under').classList.add('active');
            }
        }

        function sendData() {
            const service = document.getElementById('service_type').value;
            const date = document.getElementById('order_date').value;
            const time = document.getElementById('order_time').value;

            if (!selectedAge || !date || !time) {
                tg.showAlert("заполни все поля!");
                return;
            }

            // проверяем, что дата не в прошлом
            const selectedDate = new Date(date);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            if (selectedDate < today) {
                tg.showAlert("нельзя выбрать прошедшую дату!");
                return;
            }

            const data = {
                service: service,
                date: date,
                time: time,
                age: selectedAge,
                username: tg.initDataUnsafe?.user?.username || "неизвестно",
                user_id: tg.initDataUnsafe?.user?.id || 0
            };

            try {
                tg.sendData(JSON.stringify(data));
                tg.close();
            } catch (e) {
                tg.showAlert("ошибка отправки: " + e.message);
            }
        }

        // устанавливаем тему телеграма
        tg.onEvent('themeChanged', function() {
            tg.setHeaderColor(tg.themeParams.bg_color || '#1a0000');
        });
    </script>
</body>
</html>
