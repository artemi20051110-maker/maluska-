<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css?v=maluska_v4">
    <title>МАЛЮСКА | ЗАПИСЬ</title>
</head>
<body>
    <div class="container">
        <h1 class="title">МАЛЮСКА</h1>
        <p class="subtitle">пирсинг студия</p>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('booking')">📅 запись</button>
            <button class="tab-btn" onclick="showTab('price')">💰 прайс</button>
        </div>

        <div id="booking" class="tab-content active">
            
            <div class="form-group">
                <label>→ возраст:</label>
                <div class="age-selector">
                    <button type="button" class="age-btn" id="age-18" onclick="setAge(18)">18+</button>
                    <button type="button" class="age-btn" id="age-under" onclick="setAge(17)">до 18</button>
                </div>
            </div>

            <div class="form-group">
                <label>→ услуга:</label>
                <select id="service_type">
                    <optgroup label="нос">
                        <option value="септум">септум — 1500₽</option>
                        <option value="нострил">нострил — 1200₽</option>
                        <option value="бридж">бридж — 1800₽</option>
                    </optgroup>
                    <optgroup label="уши">
                        <option value="мочка">мочка — 800₽</option>
                        <option value="хрящ">хрящ — 1200₽</option>
                        <option value="индастриал">индастриал — 2000₽</option>
                        <option value="трагус">трагус — 1500₽</option>
                        <option value="дейс">дейс — 1800₽</option>
                    </optgroup>
                    <optgroup label="лицо">
                        <option value="бровь">бровь — 1200₽</option>
                        <option value="губа">губа — 1500₽</option>
                        <option value="язык">язык — 2000₽</option>
                    </optgroup>
                    <optgroup label="пупок">
                        <option value="пупок">пупок — 2000₽</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>→ дата: <span class="swipe-hint">← свайп →</span></label>
                <div class="calendar-wrapper">
                    <div class="calendar-grid" id="calendar"></div>
                </div>
            </div>

            <div class="form-group">
                <label>→ время:</label>
                <select id="order_time">
                    <option value="">выбери дату сначала</option>
                </select>
                <p class="time-note" id="time-note"></p>
            </div>

            <button class="main-button" onclick="sendData()">забронировать (300₽)</button>
        </div>

        <div id="price" class="tab-content">
            <h2>💰 ПРАЙС-ЛИСТ</h2>
            <div class="price-section">
                <h3>👃 нос</h3>
                <div class="price-item"><span>септум</span><span>1500₽</span></div>
                <div class="price-item"><span>нострил</span><span>1200₽</span></div>
                <div class="price-item"><span>бридж</span><span>1800₽</span></div>
            </div>
            <div class="price-section">
                <h3>👂 уши</h3>
                <div class="price-item"><span>мочка</span><span>800₽</span></div>
                <div class="price-item"><span>хрящ</span><span>1200₽</span></div>
                <div class="price-item"><span>индастриал</span><span>2000₽</span></div>
                <div class="price-item"><span>трагус</span><span>1500₽</span></div>
                <div class="price-item"><span>дейс</span><span>1800₽</span></div>
            </div>
            <div class="price-section">
                <h3>😊 лицо</h3>
                <div class="price-item"><span>бровь</span><span>1200₽</span></div>
                <div class="price-item"><span>губа</span><span>1500₽</span></div>
                <div class="price-item"><span>язык</span><span>2000₽</span></div>
            </div>
            <div class="price-section">
                <h3>💫 пупок</h3>
                <div class="price-item"><span>пупок</span><span>2000₽</span></div>
            </div>
            <p class="note">* бронь 300₽ (возвращается при посещении)</p>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        let selectedAge = "";
        let selectedDate = "";
        tg.expand();

        const WORKING_HOURS = ["16:00", "17:00", "18:00", "19:00", "20:00"];

        function generateCalendar() {
            const calendar = document.getElementById('calendar');
            const today = new Date();
            const days = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
            const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
            
            let html = '<div class="calendar-header">';
            for (let d of days) {
                html += `<div class="cal-day-name">${d}</div>`;
            }
            html += '</div><div class="calendar-days">';

            // 60 дней вместо 14
            for (let i = 0; i < 60; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                
                const dateStr = date.toISOString().split('T')[0];
                const dayNum = date.getDate();
                const month = months[date.getMonth()];
                const dayName = days[date.getDay()];
                const isToday = i === 0;
                
                html += `
                    <div class="cal-day ${isToday ? 'today' : ''}" 
                         data-date="${dateStr}" 
                         onclick="selectDate('${dateStr}')">
                        <div class="cal-day-name-short">${dayName}</div>
                        <div class="cal-day-num">${dayNum}</div>
                        <div class="cal-day-month">${month}</div>
                        <div class="cal-status">●</div>
                    </div>
                `;
            }
            html += '</div>';
            calendar.innerHTML = html;
        }

        function selectDate(date) {
            selectedDate = date;
            document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('selected'));
            document.querySelector(`[data-date="${date}"]`).classList.add('selected');
            
            const timeSelect = document.getElementById('order_time');
            const note = document.getElementById('time-note');
            
            timeSelect.innerHTML = '<option value="">выбери время</option>' + 
                WORKING_HOURS.map(slot => `<option value="${slot}">${slot}</option>`).join('');
            
            note.textContent = "⚠️ бот проверит доступность после отправки";
        }

        function setAge(age) {
            selectedAge = age >= 18 ? "18+" : "до 18";
            document.getElementById('age-18').classList.remove('active');
            document.getElementById('age-under').classList.remove('active');
            if (age >= 18) {
                document.getElementById('age-18').classList.add('active');
            } else {
                document.getElementById('age-under').classList.add('active');
            }
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function sendData() {
            const service = document.getElementById('service_type').value;
            const time = document.getElementById('order_time').value;

            if (!selectedAge) {
                tg.showAlert("выбери возраст!");
                return;
            }
            if (!selectedDate) {
                tg.showAlert("выбери дату!");
                return;
            }
            if (!time) {
                tg.showAlert("выбери время!");
                return;
            }

            const data = {
                service: service,
                date: selectedDate,
                time: time,
                age: selectedAge,
                username: tg.initDataUnsafe?.user?.username || "клиент",
                user_id: tg.initDataUnsafe?.user?.id || 0
            };

            tg.sendData(JSON.stringify(data));
        }

        generateCalendar();

        tg.onEvent('themeChanged', function() {
            tg.setHeaderColor(tg.themeParams.bg_color || '#1a0000');
        });
    </script>
</body>
</html>
