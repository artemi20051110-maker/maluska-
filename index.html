<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css?v=fix33">
    <title>МАЛЮСКА</title>
</head>
<body>
    <div class="container">
        <h1 class="title">МАЛЮСКА</h1>
        <p class="subtitle">пирсинг студия</p>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('booking')">📅 запись</button>
            <button class="tab-btn" onclick="showTab('price')">💰 прайс</button>
        </div>

        <div id="booking" class="tab-content active">
            <div class="form-group">
                <label>возраст:</label>
                <div class="age-selector">
                    <button class="age-btn" id="age-18" onclick="setAge(18)">18+</button>
                    <button class="age-btn" id="age-under" onclick="setAge(17)">до 18</button>
                </div>
            </div>

            <div class="form-group">
                <label>услуга:</label>
                <select id="service_type">
                    <option value="">выбери услугу</option>
                    <option value="септум">септум — 1500₽</option>
                    <option value="нострил">нострил — 1200₽</option>
                    <option value="бридж">бридж — 1800₽</option>
                    <option value="мочка">мочка — 800₽</option>
                    <option value="хрящ">хрящ — 1200₽</option>
                    <option value="пупок">пупок — 2000₽</option>
                </select>
            </div>

            <div class="form-group">
                <label>дата:</label>
                <div class="calendar-wrapper">
                    <div class="calendar-grid" id="calendar"></div>
                </div>
                <div class="legend">
                    <span class="legend-item"><span class="dot free"></span>свободно</span>
                    <span class="legend-item"><span class="dot busy"></span>занято</span>
                    <span class="legend-item"><span class="dot weekend"></span>выходной</span>
                </div>
            </div>

            <div class="form-group">
                <label>время на <span id="selected-date-text"></span>:</label>
                <div class="time-slots" id="time-slots"></div>
            </div>

            <button class="main-button" onclick="sendData()">забронировать (300₽)</button>
            <p class="hint">💰 бронь возвращается при посещении</p>
        </div>

        <div id="price" class="tab-content">
            <h2>💰 ПРАЙС</h2>
            <div class="price-item"><span>септум</span><span>1500₽</span></div>
            <div class="price-item"><span>нострил</span><span>1200₽</span></div>
            <div class="price-item"><span>бридж</span><span>1800₽</span></div>
            <div class="price-item"><span>мочка</span><span>800₽</span></div>
            <div class="price-item"><span>хрящ</span><span>1200₽</span></div>
            <div class="price-item"><span>пупок</span><span>2000₽</span></div>
            <p class="hint" style="margin-top: 15px;">💰 бронь 300₽ возвращается при посещении</p>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        let selectedAge = "";
        let selectedDate = "";
        let selectedTime = "";
        let bookedSlots = {}; // занятые слоты с сервера
        tg.expand();

        // 📅 РАСПИСАНИЕ (выходные и события)
        const staticSchedule = {
            "2026-03-13": { status: "weekend", times: [] },
            "2026-03-14": { status: "weekend", times: [] },
            "2026-03-15": { status: "weekend", times: [] },
            "2026-03-19": { status: "event", times: [], note: "интенсив" },
            "2026-03-20": { status: "weekend", times: [] },
            "2026-03-22": { status: "weekend", times: [], note: "тату" },
            "2026-03-23": { status: "weekend", times: [] },
            "2026-03-24": { status: "weekend", times: [] },
            "2026-03-27": { status: "weekend", times: [] }
        };

        // 🕐 доступные времена по умолчанию
        const defaultTimes = ["16:00", "17:00", "18:00", "19:00", "20:00"];

        // 🔄 ЗАГРУЗИТЬ ЗАНЯТЫЕ СЛОТЫ С СЕРВЕРА
        async function loadBookedSlots() {
            try {
                // отправляем запрос боту
                tg.sendData(JSON.stringify({ action: "get_slots" }));
                
                // слушаем ответ
                tg.onEvent('message', (event) => {
                    if (event.data && typeof event.data === 'string') {
                        try {
                            bookedSlots = JSON.parse(event.data);
                            console.log('загружены слоты:', bookedSlots);
                            generateCalendar(); // перерисовать календарь
                        } catch (e) {
                            console.error('ошибка парсинга:', e);
                        }
                    }
                });
            } catch (e) {
                console.error('ошибка загрузки слотов:', e);
            }
        }

        function generateCalendar() {
            const calendar = document.getElementById('calendar');
            const today = new Date();
            const days = ['вс','пн','вт','ср','чт','пт','сб'];
            const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
            
            let html = '<div class="cal-row">';
            days.forEach(d => html += `<div class="cal-h">${d}</div>`);
            html += '</div><div class="cal-row">';

            for (let i = 0; i < 30; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                const dateStr = date.toISOString().split('T')[0];
                const dayName = days[date.getDay()];
                const dayNum = date.getDate();
                const month = months[date.getMonth()];
                const isToday = i === 0;
                
                // проверяем статичное расписание
                const staticData = staticSchedule[dateStr];
                // проверяем занятые слоты с сервера
                const bookedTimes = bookedSlots[dateStr] || [];
                
                let statusClass = "free";
                let statusText = "";
                
                if (staticData) {
                    statusClass = staticData.status;
                    if (staticData.status === "weekend") statusText = "вых";
                    else if (staticData.status === "event") statusText = staticData.note || "событие";
                } else if (bookedTimes.length >= defaultTimes.length) {
                    // все слоты заняты
                    statusClass = "busy";
                    statusText = "нет окон";
                } else if (bookedTimes.length > 0) {
                    // частично занято
                    statusClass = "free";
                    statusText = (defaultTimes.length - bookedTimes.length) + " слотов";
                } else {
                    // свободно
                    statusClass = "free";
                    statusText = defaultTimes.length + " слотов";
                }
                
                // если все слоты заняты - помечаем как busy
                if (bookedTimes.length >= defaultTimes.length && !staticData) {
                    statusClass = "busy";
                    statusText = "нет окон";
                }
                
                html += `<div class="cal-day ${isToday?'today':''} ${statusClass}" 
                    data-date="${dateStr}" data-status="${statusClass}" onclick="selectDate('${dateStr}')">
                    <div class="cal-d">${dayName}</div>
                    <div class="cal-n">${dayNum}</div>
                    <div class="cal-m">${month}</div>
                    <div class="cal-status">${statusText}</div>
                </div>`;
            }
            html += '</div>';
            calendar.innerHTML = html;
        }

        function selectDate(date) {
            selectedDate = date;
            selectedTime = "";
            
            document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('selected'));
            document.querySelector(`[data-date="${date}"]`).classList.add('selected');
            
            updateTimeSlots(date);
        }

        function updateTimeSlots(date) {
            const container = document.getElementById('time-slots');
            const dateText = document.getElementById('selected-date-text');
            const staticData = staticSchedule[date];
            const bookedTimes = bookedSlots[date] || [];
            
            const dateObj = new Date(date);
            const dayName = dateObj.toLocaleDateString('ru-RU', { weekday: 'long' });
            dateText.textContent = `${dayName}, ${date}`;
            
            // если выходной или событие - нет времени
            if (staticData && (staticData.status === "weekend" || staticData.status === "event")) {
                container.innerHTML = '<p class="no-slots">❌ нет доступного времени</p>';
                return;
            }
            
            // фильтруем занятые времена
            const availableTimes = defaultTimes.filter(t => !bookedTimes.includes(t));
            
            if (availableTimes.length === 0) {
                container.innerHTML = '<p class="no-slots">❌ все слоты заняты</p>';
                return;
            }
            
            let html = '';
            availableTimes.forEach(time => {
                html += `<button class="time-slot" onclick="selectTime('${time}')">${time}</button>`;
            });
            container.innerHTML = html;
        }

        function selectTime(time) {
            selectedTime = time;
            document.querySelectorAll('.time-slot').forEach(t => t.classList.remove('selected'));
            event.target.classList.add('selected');
            tg.HapticFeedback.impactOccurred('light');
        }

        function setAge(age) {
            selectedAge = age >= 18 ? "18+" : "до 18";
            document.getElementById('age-18').classList.toggle('active', age >= 18);
            document.getElementById('age-under').classList.toggle('active', age < 18);
            tg.HapticFeedback.impactOccurred('light');
        }

        function showTab(name) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.target.classList.add('active');
        }

        function sendData() {
            const service = document.getElementById('service_type').value;
            
            if (!selectedAge) return tg.showAlert("выбери возраст!");
            if (!service) return tg.showAlert("выбери услугу!");
            if (!selectedDate) return tg.showAlert("выбери дату!");
            if (!selectedTime) return tg.showAlert("выбери время!");
            
            // проверка что время ещё свободно
            const bookedTimes = bookedSlots[selectedDate] || [];
            if (bookedTimes.includes(selectedTime)) {
                return tg.showAlert("❌ это время только что заняли! выбери другое");
            }
            
            tg.HapticFeedback.notificationOccurred('success');
            
            tg.sendData(JSON.stringify({
                service,
                date: selectedDate,
                time: selectedTime,
                age: selectedAge,
                username: tg.initDataUnsafe?.user?.username || "клиент"
            }));
        }

        // загрузка при старте
        loadBookedSlots();
        tg.setHeaderColor('#1a0000');
        tg.setBackgroundColor('#1a0000');
    </script>
</body>
</html>
