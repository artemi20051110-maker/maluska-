<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css?v=final_fix_v2">
</head>
<body>
    <div class="container">
        <h1 class="title">МАЛЮСКА</h1>
        
        <div class="form-group">
            <label>возраст:</label>
            <div class="age-selector">
                <button type="button" class="age-btn" id="age-18" onclick="setAge(18)">18+</button>
                <button type="button" class="age-btn" id="age-under" onclick="setAge(17)">до 18</button>
            </div>
        </div>

        <div class="form-group">
            <label>что шьем?</label>
            <select id="service_type">
                <option value="септум">септум</option>
                <option value="нострил">нострил</option>
            </select>
        </div>

        <div class="form-group">
            <input type="date" id="order_date">
            <input type="time" id="order_time">
        </div>

        <button class="main-button" id="submit_btn" onclick="sendData()">забронировать</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        let selectedAge = ""; 
        tg.expand();

        function setAge(age) {
            selectedAge = age >= 18 ? "18+" : "до 18";
            document.getElementById('age-18').style.background = age >= 18 ? "red" : "#222";
            document.getElementById('age-under').style.background = age < 18 ? "red" : "#222";
        }

        function sendData() {
            const data = {
                service: document.getElementById('service_type').value,
                date: document.getElementById('order_date').value,
                time: document.getElementById('order_time').value,
                age: selectedAge
            };

            if (!selectedAge || !data.date || !data.time) {
                tg.showAlert("заполни все поля!");
                return;
            }

            // ВНИМАНИЕ: Если ты в MenuButton, sendData может молчать.
            // Мы пробуем отправить, и если это сработает - окно закроется.
            try {
                tg.sendData(JSON.stringify(data));
            } catch (e) {
                tg.showAlert("ошибка отправки. попробуй через кнопку в чате.");
            }
        }
    </script>
</body>
</html>
