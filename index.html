<script>
  const tg = window.Telegram.WebApp;
  let selectedAge = ""; // ОБЯЗАТЕЛЬНО объявляем в начале
  tg.expand();

  // 1. Логика выбора возраста (БЕЗ НЕЕ СКРИПТ ПАДАЕТ)
  function setAge(age) {
      selectedAge = age >= 18 ? "18+" : "до 18";
      document.getElementById('age-18').classList.remove('active');
      document.getElementById('age-under').classList.remove('active');
      
      if (age >= 18) {
          document.getElementById('age-18').classList.add('active');
          document.getElementById('age-warning').style.display = 'none';
      } else {
          document.getElementById('age-under').classList.add('active');
          document.getElementById('age-warning').style.display = 'block';
      }
      
      // Показываем кнопку внизу, как только возраст выбран
      tg.MainButton.setText("ЗАБРОНИРОВАТЬ (300₽)");
      tg.MainButton.show();
  }

  // 2. Функция сбора данных (ОДНА ДЛЯ ВСЕХ)
  function collectData() {
      const data = {
          service: document.getElementById('service_type').value,
          quantity: document.getElementById('count').value,
          date: document.getElementById('order_date').value,
          time: document.getElementById('order_time').value,
          age: selectedAge
      };

      if (!selectedAge || !data.date || !data.time) {
          tg.showAlert("заполни все поля");
          return null;
      }
      return JSON.stringify(data);
  }

  // 3. Обработка нажатия на ТВОЮ кнопку (submit_btn)
  function sendData() {
      const jsonData = collectData();
      if (jsonData) {
          tg.sendData(jsonData);
      }
  }

  // 4. Обработка нажатия на СИСТЕМНУЮ кнопку (красная полоса внизу)
  tg.onEvent('mainButtonClicked', function() {
      const jsonData = collectData();
      if (jsonData) {
          tg.sendData(jsonData);
      }
  });
</script>
