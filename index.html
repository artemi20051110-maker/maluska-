<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css?v=fix30">
    <title>МАЛЮСКА</title>
</head>
<body>
    <div class="container">
        <h1 class="title">МАЛЮСКА</h1>
        <p class="subtitle">пирсинг студия</p>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('booking')">📅 запись</button>
            <button class="tab-btn" onclick="showTab('price')">💰 прайс</button>
        </div>

        <div id="booking" class="tab-content active">
            <div class="form-group">
                <label>возраст:</label>
                <div class="age-selector">
                    <button class="age-btn" id="age-18" onclick="setAge(18)">18+</button>
                    <button class="age-btn" id="age-under" onclick="setAge(17)">до 18</button>
                </div>
            </div>

            <div class="form-group">
                <label>услуга:</label>
                <select id="service_type">
                    <option value="септум">септум — 1500₽</option>
                    <option value="нострил">нострил — 1200₽</option>
                    <option value="бридж">бридж — 1800₽</option>
                    <option value="мочка">мочка — 800₽</option>
                    <option value="хрящ">хрящ — 1200₽</option>
                    <option value="пупок">пупок — 2000₽</option>
                </select>
            </div>

            <div class="form-group">
                <label>дата (листай →):</label>
                <div class="calendar-wrapper">
                    <div class="calendar-grid" id="calendar"></div>
                </div>
            </div>

            <div class="form-group">
                <label>время:</label>
                <select id="order_time">
                    <option value="">выбери дату</option>
                    <option value="16:00">16:00</option>
                    <option value="17:00">17:00</option>
                    <option value="18:00">18:00</option>
                    <option value="19:00">19:00</option>
                    <option value="20:00">20:00</option>
                </select>
            </div>

            <button class="main-button" onclick="sendData()">забронировать (300₽)</button>
        </div>

        <div id="price" class="tab-content">
            <h2>💰 ПРАЙС</h2>
            <div class="price-item"><span>септум</span><span>1500₽</span></div>
            <div class="price-item"><span>нострил</span><span>1200₽</span></div>
            <div class="price-item"><span>бридж</span><span>1800₽</span></div>
            <div class="price-item"><span>мочка</span><span>800₽</span></div>
            <div class="price-item"><span>хрящ</span><span>1200₽</span></div>
            <div class="price-item"><span>пупок</span><span>2000₽</span></div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        let selectedAge = "";
        let selectedDate = "";
        tg.expand();

        function generateCalendar() {
            const calendar = document.getElementById('calendar');
            const today = new Date();
            const days = ['вс','пн','вт','ср','чт','пт','сб'];
            const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
            
            let html = '<div class="cal-row">';
            days.forEach(d => html += `<div class="cal-h">${d}</div>`);
            html += '</div><div class="cal-row">';

            for (let i = 0; i < 30; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                const dateStr = date.toISOString().split('T')[0];
                const dayName = days[date.getDay()];
                const dayNum = date.getDate();
                const month = months[date.getMonth()];
                const isToday = i === 0;
                
                html += `<div class="cal-day ${isToday?'today':''}" data-date="${dateStr}" onclick="selectDate('${dateStr}')">
                    <div class="cal-d">${dayName}</div>
                    <div class="cal-n">${dayNum}</div>
                    <div class="cal-m">${month}</div>
                </div>`;
            }
            html += '</div>';
            calendar.innerHTML = html;
        }

        function selectDate(date) {
            selectedDate = date;
            document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('selected'));
            document.querySelector(`[data-date="${date}"]`).classList.add('selected');
        }

        function setAge(age) {
            selectedAge = age >= 18 ? "18+" : "до 18";
            document.getElementById('age-18').classList.toggle('active', age >= 18);
            document.getElementById('age-under').classList.toggle('active', age < 18);
        }

        function showTab(name) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.target.classList.add('active');
        }

        function sendData() {
            const service = document.getElementById('service_type').value;
            const time = document.getElementById('order_time').value;
            if (!selectedAge) return tg.showAlert("выбери возраст!");
            if (!selectedDate) return tg.showAlert("выбери дату!");
            if (!time) return tg.showAlert("выбери время!");
            
            tg.sendData(JSON.stringify({
                service, date: selectedDate, time, age: selectedAge,
                username: tg.initDataUnsafe?.user?.username || "клиент"
            }));
        }

        generateCalendar();
    </script>
</body>
</html>
